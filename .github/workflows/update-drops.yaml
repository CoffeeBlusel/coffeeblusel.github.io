name: Update Warframe Drops

on:
  schedule:
    - cron: '0 0 * * 0'  # every Sunday at midnight UTC
  workflow_dispatch:     # allows manual runs

permissions:
  contents: write

jobs:
  update-drops:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      - run: npm install cheerio
      
      - name: Scrape Warframe Drops
        run: node node-scripts/scrape-drops.js

      - name: List files
        run: ls -R public

      - name: Import GPG key, configure git, and commit
        env:
          GPG_PRIVATE_KEY: ${{ secrets.ACTIONS_KEY }}
        run: |

          # Create a temporary GPG home
          export GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"

          # Rebuild the key with real newlines and import
          echo "$GPG_PRIVATE_KEY" | sed 's/\\n/\n/g' | gpg --batch --import

          # Get the key ID
          KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | awk '{print $2}' | cut -d'/' -f2)

          # Configure git
          git config --global user.name "Actions Signature"
          git config --global user.email "ci@cb.dev"
          git config --global user.signingkey "$KEY_ID"
          git config --global commit.gpgsign true

          # Stage changes and commit if any
          git add public/warframe_drops.json
          git diff --cached --quiet || git commit -m "Update Warframe drops JSON"

          # Push the commit
          git push origin site

          # Clean up GPG home
          rm -rf "$GNUPGHOME"
